<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title> Social Media Post</title>
        <link rel="stylesheet" href="style.css">

    </head>

    <body>
        <div class="feed">
            <div class="post-card">
            <!--post header -->    
                <div class="post-header">
                    <img src="profile.png" class="profile-pic" alt="profile" > 
                <div>
                <h4 class="username"> Christina Lineras</h4>
                <p> 2 hrs ago </p>
            </div>
        </div>

        <!--post content-->
        <div class="'post-content">
            <p class="caption">Pack your bags, we've got the perfect stay for you</p>
            <img src="Hotel.jpg" class="post-image" alt="post image">
        </div>

        <!--post actions-->
        
        <div class="post-actions">
            <button id="likeBtn" onclick="toggleLike()">Like</button>
            <span id="likeCount">0 Likes</span>
        </div>
             </div>
        </div>
        
    <script src="script.js"> </script>    


    </body>


</html>
